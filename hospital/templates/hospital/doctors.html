<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctors - Smart Hospital</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #FFF6F9;
        }

        header {
            background: #D94F78;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #E9C7D2;
        }

        nav a {
            color: #B7355D;
            text-decoration: none;
            margin: 15px;
            font-weight: 600;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #E9C7D2;
        }

        h2 {
            color: #B7355D;
        }

        form {
            padding: 25px;
            border: 1px solid #E8D0D8;
            border-radius: 10px;
            background: #FFFDFE;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #6F3D4E;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #D9B8C4;
            border-radius: 6px;
        }

        button {
            background: #D94F78;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 18px;
        }

        button:hover {
            background: #B7355D;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #C83F68;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #E9DDE1;
        }

        .delete {
            margin: 0;
        }

        .edit {
            margin: 0 5px 0 0;
            background: #B7355D;
        }

        @media(max-width:700px) {

            .grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header>
    <h1>Doctor Management</h1>
</header>

<nav>
    <a href="/">Dashboard</a>
    <a href="/patients/">Patients</a>
    <a href="/doctors/">Doctors</a>
    <a href="/appointments/">Appointments</a>
    <a href="/treatments/">Treatments</a>
</nav>

<div class="container">

    <h2>Add Doctor</h2>

    <form id="doctorForm">

        <div class="grid">

            <div>
                <label>Doctor Name</label>
                <input type="text" id="name" required>
            </div>

            <div>
                <label>Specialization</label>
                <input type="text" id="specialization" required>
            </div>

            <div>
                <label>Phone</label>
                <input type="text" id="phone" required>
            </div>

            <div>
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

        </div>

        <button type="submit">Add Doctor</button>

    </form>

    <h2>Doctor List</h2>

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Specialization</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="doctorTable"></tbody>

        </table>

    </div>

</div>

<script>

const API = "/api/doctors/";

async function loadDoctors() {

    const response = await fetch(API);

    const doctors = await response.json();

    const table = document.getElementById("doctorTable");

    table.innerHTML = "";

    doctors.forEach(doctor => {

        table.innerHTML += `

            <tr>

                <td>${doctor.id}</td>

                <td>${doctor.name}</td>

                <td>${doctor.specialization}</td>

                <td>${doctor.phone}</td>

                <td>${doctor.email}</td>

                <td>

                    <button class="edit"
                        onclick="editDoctor(${doctor.id})">
                        Edit
                    </button>

                    <button
                        onclick="deleteDoctor(${doctor.id})">
                        Delete
                    </button>

                </td>

            </tr>

        `;

    });

}

document.getElementById("doctorForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const data = {

        name: document.getElementById("name").value,

        specialization:
            document.getElementById("specialization").value,

        phone:
            document.getElementById("phone").value,

        email:
            document.getElementById("email").value
    };

    const response = await fetch(API, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(data)
    });

    if (response.ok) {

        alert("Doctor added successfully!");

        this.reset();

        loadDoctors();

    } else {

        const error = await response.json();

        alert(JSON.stringify(error));
    }

});

async function deleteDoctor(id) {

    if (!confirm("Delete this doctor?")) {
        return;
    }

    const response = await fetch(API + id + "/", {
        method: "DELETE"
    });

    if (response.ok) {

        alert("Doctor deleted successfully!");

        loadDoctors();
    }
}

async function editDoctor(id) {

    const response = await fetch(`/api/doctors/${id}/`);
    const doctor = await response.json();

    const name = prompt("Enter doctor name:", doctor.name);
    if (name === null) return;

    const specialization = prompt("Enter specialization:", doctor.specialization);
    if (specialization === null) return;

    const phone = prompt("Enter phone:", doctor.phone);
    if (phone === null) return;

    const email = prompt("Enter email:", doctor.email);
    if (email === null) return;

    const updateResponse = await fetch(`/api/doctors/${id}/`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            specialization: specialization,
            phone: phone,
            email: email
        })
    });

    if (updateResponse.ok) {
        alert("Doctor updated successfully!");
        loadDoctors();
    } else {
        const error = await updateResponse.json();
        alert(JSON.stringify(error));
    }
}

loadDoctors();

</script>

</body>

</html>
