<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Smart Hospital</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #FFF6F9;
            color: #333;
        }

        header {
            background: #D94F78;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #E9C7D2;
        }

        nav a {
            text-decoration: none;
            color: #B7355D;
            margin: 0 15px;
            font-weight: 600;
        }

        nav a:hover {
            color: #D94F78;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 35px auto;
        }

        h2 {
            color: #B7355D;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            border: 1px solid #E9C7D2;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(180, 70, 105, 0.10);
        }

        .card h3 {
            color: #B7355D;
            margin-bottom: 10px;
        }

        .count {
            font-size: 32px;
            font-weight: bold;
            color: #D94F78;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #8D6873;
        }

        @media(max-width: 700px) {
            .cards {
                grid-template-columns: 1fr 1fr;
            }

            nav a {
                display: block;
                margin: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Smart Hospital & Patient Management System</h1>
    <p>Dashboard</p>
</header>

<nav>
    <a href="/">Dashboard</a>
    <a href="/patients/">Patients</a>
    <a href="/doctors/">Doctors</a>
    <a href="/appointments/">Appointments</a>
    <a href="/treatments/">Treatments</a>
</nav>

<div class="container">

    <h2>Hospital Overview</h2>

    <div class="cards">

        <div class="card">
            <h3>Patients</h3>
            <div class="count" id="patientCount">0</div>
        </div>

        <div class="card">
            <h3>Doctors</h3>
            <div class="count" id="doctorCount">0</div>
        </div>

        <div class="card">
            <h3>Appointments</h3>
            <div class="count" id="appointmentCount">0</div>
        </div>

        <div class="card">
            <h3>Treatments</h3>
            <div class="count" id="treatmentCount">0</div>
        </div>

    </div>

</div>

<footer>
    © 2026 Smart Hospital & Patient Management System
</footer>

<script>

async function loadDashboard() {

    const patients = await fetch("/api/patients/").then(r => r.json());
    const doctors = await fetch("/api/doctors/").then(r => r.json());
    const appointments = await fetch("/api/appointments/").then(r => r.json());
    const treatments = await fetch("/api/treatments/").then(r => r.json());

    document.getElementById("patientCount").innerText = patients.length;
    document.getElementById("doctorCount").innerText = doctors.length;
    document.getElementById("appointmentCount").innerText = appointments.length;
    document.getElementById("treatmentCount").innerText = treatments.length;
}

loadDashboard();

</script>

</body>
</html>
